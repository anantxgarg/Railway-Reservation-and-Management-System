spring.application.name=razorpay-gateway
server.port=${PAYMENTS_PORT:8081}

# Razorpay TEST keys. No defaults: set them in the environment (never commit real keys).
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# Shared "railway" database, built by database/setup.sh before this app starts.
# Same PG* variables as setup.sh, Team 1's backend and the booking service.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: Flyway owns the schema, Hibernate only checks it matches.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway. The shared database already has other teams' tables, so baseline at
# version 0: V1 and later still run (with the default baseline of 1, V1 would
# be skipped and the payment tables never created).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Team 1's JWT signing secret (HS256). Must be the same value Team 1's backend uses.
jwt.secret=${JWT_SECRET}

# Concessions and their discounts are the rows of the shared concession_rule
# table (database/c3-booking/seed_dev.sql), not settings of this app.

# Refund policy (hours before departure -> percent of paid amount)
refund.full-window-hours=48
refund.full-window-percent=90
refund.mid-window-hours=24
refund.mid-window-percent=75
refund.late-window-hours=4
refund.late-window-percent=50