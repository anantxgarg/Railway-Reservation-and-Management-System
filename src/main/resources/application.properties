spring.application.name=razorpay-gateway
server.port=8081

# Razorpay TEST Keys (environment variables with dev fallback)
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TkZpDd8I3ti0i7}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:6wcIJSy8XAQtnAxRxfqAOXyY}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:any_string_for_now}

# Primary Database: PostgreSQL (railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:railway}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Security & RBAC)
jwt.secret=${JWT_SECRET:RailwaySecretKeyForModule4JwtAuthenticationTokenValidation2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Concession (percent off base fare)
concession.general=0
concession.senior-citizen=40
concession.student=25
concession.child=50
concession.differently-abled=50
concession.armed-forces=30

# Refund policy (hours before departure -> percent of paid amount)
refund.full-window-hours=48
refund.full-window-percent=90
refund.mid-window-hours=24
refund.mid-window-percent=75
refund.late-window-hours=4
refund.late-window-percent=50