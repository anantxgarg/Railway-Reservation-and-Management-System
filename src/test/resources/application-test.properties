# Integration tests use the shared test database, built first with:
#   PGDATABASE=railway_test ./database/setup.sh --reset
# The name must end in _test; PaymentApiTestBase refuses to run otherwise.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${TEST_DB:railway_test}
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=test-key-secret
razorpay.webhook-secret=test-webhook-secret
jwt.secret=test-secret-for-payment-tests-only-0123456789abcdef
logging.level.root=WARN
