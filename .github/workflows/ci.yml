# Team 3 demo branch: runs the booking database tests, the booking-service
# tests and the frontend build on each pull request and push.
# Each job that needs PostgreSQL gets its own service container.
name: CI

on:
  pull_request:
  push:
    branches: [main, team3]

permissions:
  contents: read

env:
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  database:
    name: Team 3 - booking database (C3)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: C3 database tests (constraints, triggers, procedures, race)
        run: ./database/c3-booking/tests/run_tests.sh

  booking-service:
    name: Team 3 - booking-service API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: booking-service/pom.xml
      - name: Booking API tests
        run: ./booking-service/run_tests.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
