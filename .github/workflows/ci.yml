# Runs every team's test suite on each pull request and on pushes to main.
# Each job gets its own PostgreSQL, so suites that rebuild railway_test
# don't interfere. Razorpay is mocked in the payments tests: no secrets needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  auth:
    name: Team 1 - users and auth
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Database tests (railway_test built by setup.sh)
        run: |
          PGDATABASE=railway_test ../database/setup.sh --reset
          npm run test:db

  booking-and-payments:
    name: Team 3 booking and Team 4 payments
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            booking-service/pom.xml
      - name: C3 database tests
        run: ./database/c3-booking/tests/run_tests.sh
      - name: Booking API tests
        run: ./booking-service/run_tests.sh
      - name: Payments tests
        run: |
          PGDATABASE=railway_test ./database/setup.sh --reset
          ./mvnw -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
