# Booking service (Team 3). Every value can be set from the environment.
server.port=${BOOKING_PORT:8082}
spring.application.name=booking-service

# Shared "railway" database, built by database/setup.sh. Uses the same PG*
# variables as setup.sh and Team 1's backend.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

# Team 1's signing secret (HS256). Must be the same value Team 1's backend uses.
# No default on purpose: the service will not start without it.
booking.jwt.secret=${JWT_SECRET}

# Expire unpaid holds (CALL expire_holds()) this often, in milliseconds.
booking.expire-holds.enabled=true
booking.expire-holds.interval-ms=60000
