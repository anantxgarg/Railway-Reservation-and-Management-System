# Tests use a separate database, built by run_tests.sh (database/setup.sh with dev data).
# The name must end in _test; ApiTestBase refuses to run otherwise.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${TEST_DB:railway_test}
booking.jwt.secret=test-secret-for-booking-service-tests-only-0123456789
booking.expire-holds.enabled=false
logging.level.root=WARN
booking.notifications.enabled=false
