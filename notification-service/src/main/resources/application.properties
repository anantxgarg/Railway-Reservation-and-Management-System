# ---------------------------------------------------------------------------
# application.properties = settings Spring Boot reads when the app starts.
# Change values here instead of changing Java code.
# Every ${NAME:default} can be set from the environment, like the other teams' apps.
# ---------------------------------------------------------------------------

spring.application.name=team6-notification-service

# The port our web server listens on. 8086 = "Team 6", so it won't clash with other teams' apps.
# Our API will be at http://localhost:8086/api/...
server.port=${NOTIFICATIONS_PORT:8086}

# Where MongoDB is running, and which database to use.
# "team6_railway" is created automatically the first time we save something.
# (Team 1's audit log uses MONGO_URI for its own database, so ours has its own name.)
spring.data.mongodb.uri=${TEAM6_MONGO_URI:mongodb://localhost:27017/team6_railway}

# Ask Spring to create the indexes we declared with @CompoundIndex (makes "newest first" queries fast,
# and stops the same user from giving feedback twice for one PNR).
spring.data.mongodb.auto-index-creation=true

# Put the reason for an error into the reply, e.g. {"status": 409, "message": "Feedback for PNR ... was already submitted"}.
# Without these lines Spring leaves "message" empty, and the frontend reads body.message.
server.error.include-message=always
server.error.include-binding-errors=always

# Logins are Team 1's: the same JWT_SECRET as Team 1's backend and the other services.
# No default on purpose: the app will not start without it.
team6.jwt.secret=${JWT_SECRET}

# Other services send notifications with this key in the "X-Internal-Key" header.
# Set the same NOTIFICATIONS_API_KEY for booking-service. Empty = no key needed
# (development only; the app logs a warning).
team6.internal-key=${NOTIFICATIONS_API_KEY:}

# Turns the /api/demo/... endpoints on or off. Set to true (TEAM6_DEMO=true) only for a demo.
team6.demo.enabled=${TEAM6_DEMO:false}
